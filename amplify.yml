version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 22.23.3
        - nvm use 22.23.3
        - npm install --global npm@10.9.0
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22.23.3
    build:
      commands:
        - npm run test
        - npm run check:backend
        - VITE_DATA_MODE=aws npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
